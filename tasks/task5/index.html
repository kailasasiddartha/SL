
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5 - Item Billing System (PHP explode)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Item Billing System</h2>
        <p class="subtitle">Enter comma-separated values for 5 items using only 4 text boxes.</p>

        
            <div class="alert error"></div>
        

        <form method="POST" action="bill.php">
            <div class="form-group">
                <label for="item_codes">1. Item Codes (5 comma-separated):</label>
                <input type="text" id="item_codes" name="item_codes" value="" required>
            </div>

            <div class="form-group">
                <label for="item_names">2. Item Names (5 comma-separated):</label>
                <input type="text" id="item_names" name="item_names" value="" required>
            </div>

            <div class="form-group">
                <label for="units_sold">3. Units Sold (5 comma-separated):</label>
                <input type="text" id="units_sold" name="units_sold" value="" required>
            </div>

            <div class="form-group">
                <label for="rates">4. Rates per Unit (5 comma-separated):</label>
                <input type="text" id="rates" name="rates" value="" required>
            </div>

            <button type="submit" class="btn">Generate Bill</button>
        </form>

        
            <div class="bill-output">
                <h3>Invoice / Billing Summary</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Item Code</th>
                            <th>Item Name</th>
                            <th>Units Sold</th>
                            <th>Rate (INR)</th>
                            <th>Amount (INR)</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                        <tr>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        
                    </tbody>
                    <tfoot>
                        <tr class="total-row">
                            <td colspan="4">Grand Total</td>
                            <td><strong>INR </strong></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        
    </div>
</body>
</html>
