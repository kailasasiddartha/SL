<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<style>
body {
font-family: Arial, sans-serif;
background-color: #f4f4f4;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
height: 100vh;
}
.container {
background: white;
padding: 20px;
border-radius: 8px;
box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
width: 300px;
text-align: center;
margin-bottom: 20px;
}
input {
width: 80%;
padding: 10px;
margin-bottom: 10px;
border: 1px solid #ccc;
border-radius: 4px;
}
button {
padding: 10px 15px;
background: #28a745;
color: white;
border: none;
cursor: pointer;
border-radius: 4px;
}
ul {
list-style: none;
padding: 0;
}
li {
background: #eee;
margin: 5px 0;
padding: 10px;
display: flex;
justify-content: space-between;
align-items: center;
border-radius: 4px;
}
.completed {
text-decoration: line-through;
color: gray;
}
.delete {
background: red;
color: white;
border: none;
padding: 5px 10px;
cursor: pointer;
border-radius: 4px;
}
table {
width: 300px;
border-collapse: collapse;
margin-top: 20px;
background: white;
border-radius: 8px;
box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}
th, td {
border: 1px solid #ccc;
padding: 8px;
text-align: left;
}
</style>
</head>
<body>
<div class="container">
<h2>To-Do List</h2>
<input type="text" id="taskInput" placeholder="Add a new task...">
<button onclick="addTask()">Add</button>
<ul id="taskList"></ul>
</div>
<table>
<thead>
<tr>
<th>Task</th>
</tr>
</thead>
<tbody id="taskTable"></tbody>
</table>
<script>
function addTask() {
let taskInput = document.getElementById("taskInput"); //let var both are same
let taskText = taskInput.value.trim();
if (taskText === "") return;
let li = document.createElement("li");
li.innerHTML = `${taskText} <button class="delete" onclick="removeTask(this, '${taskText}')">X</button>`;
li.onclick = function () {
li.classList.toggle("completed");
};
document.getElementById("taskList").appendChild(li);
taskInput.value = "";
let tableRow = document.createElement("tr");
tableRow.setAttribute("data-task", taskText);
tableRow.innerHTML = `<td>${taskText}</td>`;
document.getElementById("taskTable").appendChild(tableRow);
}
function removeTask(button, taskText) {
let taskItem = button.parentElement;
let tableRows = document.querySelectorAll("#taskTable tr");
tableRows.forEach(row => {
if (row.getAttribute("data-task") === taskText) {
row.remove();
}
});
taskItem.remove();
}
</script>
</body>
</html>
