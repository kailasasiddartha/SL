<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Toggle Webpage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 30px;
            display: inline-block;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        img {
            width: 320px;
            height: 220px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid #ddd;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            background-color: #008CBA;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #007bb5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Image Toggle Application</h2>
        <!-- Initial Image Display -->
        <img id="toggleImg" src="image1.png" alt="Image 1">
        <br>
        <button onclick="toggleImage()">Toggle Image</button>
    </div>

    <script>
        function toggleImage() {
            let imgElement = document.getElementById("toggleImg");
            
            // Check current source and toggle to alternate image
            if (imgElement.src.includes("image1")) {
                imgElement.src = "image2.png";
                imgElement.alt = "Image 2";
            } else {
                imgElement.src = "image1.png";
                imgElement.alt = "Image 1";
            }
        }
    </script>

</body>
</html>
