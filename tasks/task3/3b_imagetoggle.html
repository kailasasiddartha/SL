<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Toggle</title>
<style>
body
{
text-align: center;
font-family: Arial, sans-serif;
margin-top: 50px;
}
img
{
width: 300px;
height: auto;
display: block;
margin: 20px auto;
}
button {
padding: 10px 20px;
font-size: 16px;
cursor: pointer;
}
</style>
</head>
<body>
<h1>Toggle Between Two Images</h1>
<img id="toggleImage" src="1.jpg" alt="Image">
<button onclick="toggleImage()">Toggle Image</button>
<script>
function toggleImage() {
var img = document.getElementById("toggleImage");
var currentSrc = img.src.split('/').pop(); // Get filename only
if (currentSrc === "1.jpg")
{
img.src = "2.jpg";
}
else {
img.src = "1.jpg";
}
}
</script>
</body>
</html>
